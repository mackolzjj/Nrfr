name: Build Nrfr APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 腾讯镜像在海外 runner 上不稳定，CI 内改用 Gradle 官方源
      - name: Use official Gradle distribution
        run: sed -i 's#distributionUrl=.*gradle-[0-9.]*-bin.zip#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' gradle/wrapper/gradle-wrapper.properties

      # ubuntu-latest 已预装 Android SDK，直接用预装的 sdkmanager 接受 license 并装 platform 36
      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Normalize gradlew line endings and grant permission
        run: |
          python3 -c "p='gradlew'; d=open(p,'rb').read().replace(b'\r\n',b'\n').replace(b'\r',b'\n'); open(p,'wb').write(d)"
          chmod +x gradlew
          bash -n gradlew && echo "gradlew syntax OK"

      # 该项目的 gradlew 在 JAVA_HOME 存在时未给 JAVA_CMD 赋值（脚本缺陷），此处显式指定
      # 正式签名 release 构建：证书来自仓库内 release-keystore.p12（PKCS12）
      - name: Build Signed Release APK
        run: |
          export JAVA_CMD="$JAVA_HOME/bin/java"
          "$JAVA_CMD" -version
          bash gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nrfr-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
